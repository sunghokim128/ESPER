<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ESPER</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-97FBRP5G8P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-97FBRP5G8P');
    </script>
    <link rel="stylesheet" href="app.css?v=140" />
    <script>
      if ('serviceWorker' in navigator) {
        const appScope = new URL('./', window.location.href).href;
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(
            registrations
              .filter((registration) => registration.scope === appScope)
              .map((registration) => registration.unregister())
          ))
          .catch((error) => console.warn('Could not unregister ESPER service worker.', error));
      }

      if ('caches' in window) {
        window.caches.keys()
          .then((cacheNames) => Promise.all(
            cacheNames
              .filter((name) => name.startsWith('esper-app-'))
              .map((name) => window.caches.delete(name))
          ))
          .catch((error) => console.warn('Could not clear ESPER app caches.', error));
      }
    </script>
  </head>
  <body>
    <div id="app" class="app-shell"></div>
    <div id="printRoot" class="print-root"></div>
    <script type="module" src="app.js?v=140"></script>
  </body>
</html>
