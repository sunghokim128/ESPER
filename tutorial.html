<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESPER 소개</title>
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body>
    <button type="button" class="lang" data-lang-toggle aria-label="언어">English</button>

    <main>
      <h1>ESPER</h1>
      <p class="intro" data-i18n="intro">엑셀이나 Anki 덱을 간편하게 플래시카드로 바꾸고, 나만의 속도로 학습해 보세요.</p>

      <div class="video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/J7beSHbJy94?autoplay=1&mute=1&start=5&cc_load_policy=1&cc_lang_pref=ko&playsinline=1&rel=0"
          title="ESPER 소개 영상"
          allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <a class="start" href="./" data-i18n="start">학습하러 가기</a>
    </main>

    <script>
      const T = {
        en: {
          intro: 'Turn an Excel sheet or Anki deck into flashcards and start learning at your own pace.',
          start: 'Start studying',
          toggle: '한국어',
        },
        ko: {
          intro: '엑셀이나 Anki 덱을 간편하게 플래시카드로 바꾸고, 나만의 속도로 학습해 보세요.',
          start: '학습하러 가기',
          toggle: 'English',
        },
      };
      let lang = localStorage.getItem('esper-landing-lang')
        || (Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Seoul' ? 'ko' : 'en');
      function apply() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[lang][el.dataset.i18n]; });
        document.querySelector('[data-lang-toggle]').textContent = T[lang].toggle;
      }
      document.querySelector('[data-lang-toggle]').addEventListener('click', () => {
        lang = lang === 'ko' ? 'en' : 'ko';
        localStorage.setItem('esper-landing-lang', lang);
        apply();
      });
      apply();
    </script>
  </body>
</html>
